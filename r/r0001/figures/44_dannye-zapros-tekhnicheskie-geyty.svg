<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 976" width="800" height="976" role="img" aria-labelledby="t d">
  <title id="t">Фигура 44. Данные → запрос → технические гейты</title>
  <desc id="d">Глава 15, урок 29, раздел 4 «Центральная схема: карта доверия и последствий» (спецификация: после Provenance, раздел 3 «Кто назначает доверие»). Внешний источник получает provenance от harness и остаётся untrusted_content; модель может прочитать данные и только запросить действие; запрос проходит allowlist, schema, permissions и approval и заканчивается разрешённым ограниченным эффектом или отказом.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52606D"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="976" fill="#FFFFFF"/>
  <g font-family="PT Sans, DejaVu Sans, Arial, sans-serif" font-size="20" fill="#1F2933" text-anchor="middle">
    <!-- внешний источник -->
    <rect data-role="source" x="40" y="16" width="560" height="46" rx="6" fill="#F5F7FA" stroke="#52606D" stroke-width="1.5"/>
    <text x="320" y="46">внешний источник</text>
    <line x1="320" y1="62" x2="320" y2="84" stroke="#52606D" stroke-width="1.5" marker-end="url(#arrow)"/>
    <!-- provenance от harness -->
    <rect data-role="provenance" x="40" y="86" width="560" height="80" rx="6" fill="#F5F7FA" stroke="#1D4ED8" stroke-width="1.5"/>
    <text x="320" y="116">harness назначает provenance</text>
    <text x="320" y="148" font-family="PT Mono, DejaVu Sans Mono, monospace" font-size="18">"assigned_by": "harness"</text>
    <line x1="320" y1="166" x2="320" y2="188" stroke="#52606D" stroke-width="1.5" marker-end="url(#arrow)"/>
    <!-- untrusted_content -->
    <rect data-role="untrusted" x="40" y="190" width="560" height="80" rx="6" fill="#F5F7FA" stroke="#52606D" stroke-width="1.5"/>
    <text x="320" y="222" font-family="PT Mono, DejaVu Sans Mono, monospace">untrusted_content</text>
    <text x="320" y="254" font-family="PT Mono, DejaVu Sans Mono, monospace" font-size="18">"trust": "untrusted"</text>
    <line x1="320" y1="270" x2="320" y2="292" stroke="#52606D" stroke-width="1.5" marker-end="url(#arrow)"/>
    <!-- модель -->
    <rect data-role="model" x="40" y="294" width="560" height="46" rx="6" fill="#F5F7FA" stroke="#52606D" stroke-width="1.5"/>
    <text x="320" y="324">модель может прочитать данные</text>
    <line x1="320" y1="340" x2="320" y2="362" stroke="#52606D" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect data-role="request" x="40" y="364" width="560" height="80" rx="6" fill="#F5F7FA" stroke="#52606D" stroke-width="1.5"/>
    <text x="320" y="396">модель может только ЗАПРОСИТЬ действие</text>
    <text x="320" y="428" font-family="PT Mono, DejaVu Sans Mono, monospace" font-size="18">request only</text>
    <line x1="320" y1="444" x2="320" y2="466" stroke="#52606D" stroke-width="1.5" marker-end="url(#arrow)"/>
    <!-- технические гейты -->
    <rect class="gate" data-role="gate" x="40" y="468" width="560" height="46" rx="6" fill="#F5F7FA" stroke="#1D4ED8" stroke-width="1.5"/>
    <text x="320" y="498">allowlist</text>
    <line x1="320" y1="514" x2="320" y2="532" stroke="#52606D" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect class="gate" data-role="gate" x="40" y="534" width="560" height="46" rx="6" fill="#F5F7FA" stroke="#1D4ED8" stroke-width="1.5"/>
    <text x="320" y="564">schema</text>
    <line x1="320" y1="580" x2="320" y2="598" stroke="#52606D" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect class="gate" data-role="gate" x="40" y="600" width="560" height="46" rx="6" fill="#F5F7FA" stroke="#1D4ED8" stroke-width="1.5"/>
    <text x="320" y="630">permissions</text>
    <line x1="320" y1="646" x2="320" y2="664" stroke="#52606D" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect class="gate" data-role="gate" x="40" y="666" width="560" height="46" rx="6" fill="#F5F7FA" stroke="#B45309" stroke-width="1.5"/>
    <text x="320" y="696">approval</text>
    <!-- отказ на любом гейте -->
    <g stroke="#B91C1C" stroke-width="1.5" marker-end="url(#arrow)">
      <line x1="600" y1="491" x2="622" y2="491"/>
      <line x1="600" y1="557" x2="622" y2="557"/>
      <line x1="600" y1="623" x2="622" y2="623"/>
      <line x1="600" y1="689" x2="622" y2="689"/>
    </g>
    <rect data-role="deny" x="624" y="468" width="152" height="244" rx="6" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.5"/>
    <text x="700" y="582" fill="#B91C1C">deny</text>
    <text x="700" y="610" font-size="18">отказ</text>
    <!-- эффект -->
    <line x1="320" y1="712" x2="320" y2="734" stroke="#52606D" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect data-role="effect" x="40" y="736" width="560" height="64" rx="6" fill="#F5F7FA" stroke="#15803D" stroke-width="1.5"/>
    <text x="320" y="762" fill="#15803D">effect</text>
    <text x="320" y="788" font-size="18">разрешённый ограниченный эффект</text>
    <!-- подписи-неравенства -->
    <g font-family="PT Mono, DejaVu Sans Mono, monospace" font-size="18">
      <rect x="220" y="820" width="360" height="40" rx="6" fill="#F5F7FA" stroke="#1F2933" stroke-width="1.5" stroke-dasharray="6 4"/>
      <text class="inequality" x="400" y="846">data ≠ instruction</text>
      <rect x="220" y="868" width="360" height="40" rx="6" fill="#F5F7FA" stroke="#1F2933" stroke-width="1.5" stroke-dasharray="6 4"/>
      <text class="inequality" x="400" y="894">request ≠ effect</text>
      <rect x="220" y="916" width="360" height="40" rx="6" fill="#F5F7FA" stroke="#1F2933" stroke-width="1.5" stroke-dasharray="6 4"/>
      <text class="inequality" x="400" y="942">permission ≠ trust</text>
    </g>
  </g>
</svg>
