<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-labelledby="t d">
  <title id="t">Фигура 42. Три гейта и одно изменение состояния</title>
  <desc id="d">Глава 14, урок 28, раздел 6 «Центральный артефакт: три гейта и одно изменение состояния». Ответ модели проходит профиль 07_tools.json, dispatcher и даёт proposal; Approval gate по политике 14_permissions.json решает, спрашивать ли человека; изменение статуса делает apply_status_update только после решения человека.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52606D"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="1000" fill="#FFFFFF"/>
  <g font-family="PT Sans, DejaVu Sans, Arial, sans-serif" font-size="20" fill="#1F2933" text-anchor="middle">
    <!-- ответ модели -->
    <rect data-role="model-response" x="40" y="20" width="430" height="56" rx="6" fill="#F5F7FA" stroke="#52606D" stroke-width="1.5"/>
    <text x="255" y="55" font-family="PT Mono, DejaVu Sans Mono, monospace" font-size="18">ответ модели с tool_calls</text>
    <line x1="255" y1="76" x2="255" y2="104" stroke="#52606D" stroke-width="1.5" marker-end="url(#arrow)"/>
    <!-- [1] профиль -->
    <rect class="gate" data-role="gate" x="40" y="106" width="430" height="90" rx="6" fill="#F5F7FA" stroke="#1D4ED8" stroke-width="1.5"/>
    <text x="255" y="140">[1] профиль 07_tools.json</text>
    <text x="255" y="172" font-size="18">имя вне профиля — весь ответ отвергнут</text>
    <line x1="470" y1="151" x2="498" y2="151" stroke="#B91C1C" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect data-role="rejected" x="500" y="106" width="276" height="90" rx="6" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.5"/>
    <text x="638" y="140" font-size="18" fill="#B91C1C">запрещённое имя:</text>
    <text x="638" y="166" font-size="18">ответ отвергнут</text>
    <text x="638" y="190" font-size="18">до dispatcher</text>
    <line x1="255" y1="196" x2="255" y2="224" stroke="#52606D" stroke-width="1.5" marker-end="url(#arrow)"/>
    <!-- [2] dispatcher -->
    <rect class="gate" data-role="gate" x="40" y="226" width="430" height="90" rx="6" fill="#F5F7FA" stroke="#1D4ED8" stroke-width="1.5"/>
    <text x="255" y="254">[2] dispatcher главы 7</text>
    <text x="255" y="280">один call: allowlist, schema,</text>
    <text x="255" y="304">выполнение tool</text>
    <line x1="255" y1="316" x2="255" y2="344" stroke="#52606D" stroke-width="1.5" marker-end="url(#arrow)"/>
    <!-- proposal -->
    <rect data-role="proposal" x="40" y="346" width="430" height="90" rx="6" fill="#F5F7FA" stroke="#52606D" stroke-width="1.5"/>
    <text x="255" y="380" font-family="PT Mono, DejaVu Sans Mono, monospace" font-size="18">propose_status_update(...)</text>
    <text x="255" y="410" font-size="18">proposal: before/after, applied: false</text>
    <line x1="255" y1="436" x2="255" y2="464" stroke="#52606D" stroke-width="1.5" marker-end="url(#arrow)"/>
    <!-- [3] Approval gate -->
    <rect class="gate" data-role="approval-gate" x="40" y="466" width="430" height="110" rx="6" fill="#F5F7FA" stroke="#B45309" stroke-width="1.5"/>
    <text x="255" y="498">[3] Approval gate</text>
    <text x="255" y="526" font-size="18">политика 14_permissions.json:</text>
    <text x="255" y="552" font-size="18">изменение — после решения человека?</text>
    <line x1="470" y1="521" x2="498" y2="521" stroke="#B91C1C" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect data-role="rejected" x="500" y="466" width="276" height="110" rx="6" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.5"/>
    <text x="638" y="498" font-size="18" fill="#B91C1C">нет:</text>
    <text x="638" y="522" font-size="18">человека не спрашивают;</text>
    <text x="638" y="546" font-size="18" font-family="PT Mono, DejaVu Sans Mono, monospace">apply_status_update</text>
    <text x="638" y="568" font-size="18">не вызывается</text>
    <line x1="255" y1="576" x2="255" y2="604" stroke="#B45309" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="268" y="596" font-size="18" fill="#B45309" text-anchor="start">да</text>
    <!-- Human approval -->
    <rect data-role="human" x="40" y="606" width="430" height="70" rx="6" fill="#FFFFFF" stroke="#B45309" stroke-width="2"/>
    <text x="255" y="638">Human approval</text>
    <text x="255" y="664" font-size="18">решение человека о конкретном proposal</text>
    <!-- deny / approve -->
    <polyline points="255,676 255,690 205,690 205,704" fill="none" stroke="#52606D" stroke-width="1.5" marker-end="url(#arrow)"/>
    <polyline points="255,690 590,690 590,704" fill="none" stroke="#52606D" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect class="apply" data-role="apply" x="24" y="706" width="362" height="124" rx="6" fill="#F5F7FA" stroke="#B91C1C" stroke-width="1.5"/>
    <text x="205" y="736" fill="#B91C1C">deny</text>
    <text x="205" y="766" font-size="18" font-family="PT Mono, DejaVu Sans Mono, monospace">apply_status_update(</text>
    <text x="205" y="792" font-size="18" font-family="PT Mono, DejaVu Sans Mono, monospace">approved=False)</text>
    <text x="205" y="818" font-size="18">applied: false</text>
    <rect class="apply" data-role="apply" x="414" y="706" width="362" height="124" rx="6" fill="#F5F7FA" stroke="#15803D" stroke-width="1.5"/>
    <text x="595" y="736" fill="#15803D">approve</text>
    <text x="595" y="766" font-size="18" font-family="PT Mono, DejaVu Sans Mono, monospace">apply_status_update(</text>
    <text x="595" y="792" font-size="18" font-family="PT Mono, DejaVu Sans Mono, monospace">approved=True)</text>
    <text x="595" y="818" font-size="18">status-only change</text>
    <!-- подписи-неравенства -->
    <g font-family="PT Mono, DejaVu Sans Mono, monospace" font-size="18">
      <rect x="180" y="852" width="440" height="40" rx="6" fill="#F5F7FA" stroke="#1F2933" stroke-width="1.5" stroke-dasharray="6 4"/>
      <text class="inequality" x="400" y="878">proposal ≠ application</text>
      <rect x="180" y="900" width="440" height="40" rx="6" fill="#F5F7FA" stroke="#1F2933" stroke-width="1.5" stroke-dasharray="6 4"/>
      <text class="inequality" x="400" y="926">approval event ≠ Approval gate</text>
      <rect x="180" y="948" width="440" height="40" rx="6" fill="#F5F7FA" stroke="#1F2933" stroke-width="1.5" stroke-dasharray="6 4"/>
      <text class="inequality" x="400" y="974">model confidence ≠ Human approval</text>
    </g>
  </g>
</svg>
