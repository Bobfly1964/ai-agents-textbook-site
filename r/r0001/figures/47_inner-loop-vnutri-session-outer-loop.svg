<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 972" width="800" height="972" role="img" aria-labelledby="t d">
  <title id="t">Фигура 47. Inner loop внутри Session, Outer loop между Session</title>
  <desc id="d">Глава 16, урок 31, раздел 1 «Два масштаба работы». Проект — три отдельные Session; внутри каждой знакомый agent loop главы 2 (Inner loop): step, observation, decision, continue назад к step. После terminal — checkpoint + Handoff; следующая Session сначала проверяет checkpoint. Цепочка Session по проверенному внешнему state — Outer loop.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52606D"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="972" fill="#FFFFFF"/>
  <g font-family="PT Sans, DejaVu Sans, Arial, sans-serif" font-size="20" fill="#1F2933" text-anchor="middle">
    <!-- проект -->
    <rect data-role="project" x="12" y="12" width="776" height="672" rx="6" fill="#FFFFFF" stroke="#52606D" stroke-width="1.5"/>
    <text x="32" y="44" font-size="22" text-anchor="start">Проект</text>
    <!-- Session 1 -->
    <rect class="session" data-role="session-1" x="28" y="60" width="744" height="128" rx="6" fill="#F5F7FA" stroke="#52606D" stroke-width="1.5"/>
    <text x="52" y="94" text-anchor="start">Session 1</text>
    <text x="52" y="137" font-size="18" text-anchor="start" fill="#52606D">Inner loop</text>
    <rect class="stage" data-role="stage" x="200" y="110" width="90" height="42" rx="6" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.5"/>
    <text x="245" y="137" font-size="18">step</text>
    <rect class="stage" data-role="stage" x="320" y="110" width="160" height="42" rx="6" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.5"/>
    <text x="400" y="137" font-size="18">observation</text>
    <rect class="stage" data-role="stage" x="510" y="110" width="130" height="42" rx="6" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.5"/>
    <text x="575" y="137" font-size="18">decision</text>
    <g stroke="#52606D" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
      <line x1="290" y1="131" x2="318" y2="131"/>
      <line x1="480" y1="131" x2="508" y2="131"/>
    </g>
    <polyline points="575,152 575,170 245,170 245,154" fill="none" stroke="#1D4ED8" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="587" y="176" font-size="18" text-anchor="start" fill="#1D4ED8" font-family="PT Mono, DejaVu Sans Mono, monospace">continue</text>
    <!-- terminal → checkpoint + Handoff → Session 2 -->
    <polyline points="640,131 700,131 700,220" fill="none" stroke="#52606D" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="690" y="210" font-size="18" text-anchor="end">terminal</text>
    <rect class="checkpoint" data-role="checkpoint-1" x="460" y="222" width="312" height="44" rx="6" fill="#F5F7FA" stroke="#52606D" stroke-width="1.5"/>
    <text x="616" y="251">checkpoint + Handoff</text>
    <text x="444" y="250" font-size="18" text-anchor="end" fill="#52606D">Outer loop</text>
    <line x1="700" y1="266" x2="700" y2="298" stroke="#52606D" stroke-width="1.5" marker-end="url(#arrow)"/>
    <!-- Session 2 -->
    <rect class="session" data-role="session-2" x="28" y="300" width="744" height="128" rx="6" fill="#F5F7FA" stroke="#52606D" stroke-width="1.5"/>
    <text x="52" y="334" text-anchor="start">Session 2</text>
    <text x="748" y="334" font-size="18" text-anchor="end">validate checkpoint</text>
    <text x="52" y="377" font-size="18" text-anchor="start" fill="#52606D">Inner loop</text>
    <rect class="stage" data-role="stage" x="200" y="350" width="90" height="42" rx="6" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.5"/>
    <text x="245" y="377" font-size="18">step</text>
    <rect class="stage" data-role="stage" x="320" y="350" width="160" height="42" rx="6" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.5"/>
    <text x="400" y="377" font-size="18">observation</text>
    <rect class="stage" data-role="stage" x="510" y="350" width="130" height="42" rx="6" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.5"/>
    <text x="575" y="377" font-size="18">decision</text>
    <g stroke="#52606D" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
      <line x1="290" y1="371" x2="318" y2="371"/>
      <line x1="480" y1="371" x2="508" y2="371"/>
    </g>
    <polyline points="575,392 575,410 245,410 245,394" fill="none" stroke="#1D4ED8" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="587" y="416" font-size="18" text-anchor="start" fill="#1D4ED8" font-family="PT Mono, DejaVu Sans Mono, monospace">continue</text>
    <!-- terminal → checkpoint + Handoff → Session 3 -->
    <polyline points="640,371 700,371 700,460" fill="none" stroke="#52606D" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="690" y="450" font-size="18" text-anchor="end">terminal</text>
    <rect class="checkpoint" data-role="checkpoint-2" x="460" y="462" width="312" height="44" rx="6" fill="#F5F7FA" stroke="#52606D" stroke-width="1.5"/>
    <text x="616" y="491">checkpoint + Handoff</text>
    <text x="444" y="490" font-size="18" text-anchor="end" fill="#52606D">Outer loop</text>
    <line x1="700" y1="506" x2="700" y2="538" stroke="#52606D" stroke-width="1.5" marker-end="url(#arrow)"/>
    <!-- Session 3 -->
    <rect class="session" data-role="session-3" x="28" y="540" width="744" height="128" rx="6" fill="#F5F7FA" stroke="#52606D" stroke-width="1.5"/>
    <text x="52" y="574" text-anchor="start">Session 3 …</text>
    <text x="748" y="574" font-size="18" text-anchor="end">validate checkpoint</text>
    <text x="52" y="617" font-size="18" text-anchor="start" fill="#52606D">Inner loop</text>
    <rect class="stage" data-role="stage" x="200" y="590" width="90" height="42" rx="6" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.5"/>
    <text x="245" y="617" font-size="18">step</text>
    <rect class="stage" data-role="stage" x="320" y="590" width="160" height="42" rx="6" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.5"/>
    <text x="400" y="617" font-size="18">observation</text>
    <rect class="stage" data-role="stage" x="510" y="590" width="130" height="42" rx="6" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.5"/>
    <text x="575" y="617" font-size="18">decision</text>
    <g stroke="#52606D" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
      <line x1="290" y1="611" x2="318" y2="611"/>
      <line x1="480" y1="611" x2="508" y2="611"/>
    </g>
    <polyline points="575,632 575,650 245,650 245,634" fill="none" stroke="#1D4ED8" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="587" y="656" font-size="18" text-anchor="start" fill="#1D4ED8" font-family="PT Mono, DejaVu Sans Mono, monospace">continue</text>
    <!-- определение Outer loop (гл. 16, стр. 68) -->
    <text x="400" y="714" font-size="18">Outer loop = последовательность Session</text>
    <text x="400" y="740" font-size="18">по внешнему проверенному state</text>
    <!-- подписи-неравенства -->
    <g font-family="PT Mono, DejaVu Sans Mono, monospace" font-size="18">
      <rect x="180" y="764" width="440" height="40" rx="6" fill="#F5F7FA" stroke="#1F2933" stroke-width="1.5" stroke-dasharray="6 4"/>
      <text class="inequality" x="400" y="790">Trace ≠ checkpoint</text>
      <rect x="180" y="812" width="440" height="40" rx="6" fill="#F5F7FA" stroke="#1F2933" stroke-width="1.5" stroke-dasharray="6 4"/>
      <text class="inequality" x="400" y="838">checkpoint ≠ full transcript</text>
      <rect x="180" y="860" width="440" height="40" rx="6" fill="#F5F7FA" stroke="#1F2933" stroke-width="1.5" stroke-dasharray="6 4"/>
      <text class="inequality" x="400" y="886">Outer loop ≠ retry</text>
      <rect x="180" y="908" width="440" height="40" rx="6" fill="#F5F7FA" stroke="#1F2933" stroke-width="1.5" stroke-dasharray="6 4"/>
      <text class="inequality" x="400" y="934">resumable ≠ safe to repeat effects</text>
    </g>
  </g>
</svg>
