<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="t d">
  <title id="t">Фигура 36. Incident report</title>
  <desc id="d">Глава 12, урок 24, раздел 5 «Центральный приём диагностики: симптом → point → cause». Короткий incident report по таблице главы: сверху вниз симптом, failure point, Root cause, доказательство — конкретное событие Trace — и добавленная к ним локальная правка, которая здесь только предложение по месту исправления; у каждой строки вопрос и пример случая с неизвестным именем tool.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52606D"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="500" fill="#FFFFFF"/>
  <g font-family="PT Sans, DejaVu Sans, Arial, sans-serif" font-size="18" fill="#1F2933">
    <!-- заголовки столбцов — таблица главы 12, раздел 5 -->
    <text x="18" y="46" fill="#52606D">Вопрос</text>
    <text x="276" y="46" fill="#52606D">Что ищем</text>
    <text x="506" y="46" fill="#52606D">Пример</text>
    <!-- пять строк отчёта в порядке главы; стрелки — порядок заполнения -->
    <rect class="row" data-role="symptom" x="8" y="60" width="784" height="64" rx="6" fill="#F5F7FA" stroke="#1D4ED8" stroke-width="1.5"/>
    <text x="18" y="87">Как выглядит</text>
    <text x="18" y="111">проблема?</text>
    <text x="276" y="99">симптом</text>
    <text x="506" y="99" font-family="PT Mono, DejaVu Sans Mono, monospace">terminal: error</text>
    <line x1="330" y1="124" x2="330" y2="146" stroke="#52606D" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect class="row" data-role="failure-point" x="8" y="148" width="784" height="64" rx="6" fill="#F5F7FA" stroke="#1D4ED8" stroke-width="1.5"/>
    <text x="18" y="175">Где впервые</text>
    <text x="18" y="199">отклонился маршрут?</text>
    <text x="276" y="187">failure point</text>
    <text x="506" y="175" font-family="PT Mono, DejaVu Sans Mono, monospace">tool_requested</text>
    <text x="506" y="199">с неизвестным именем</text>
    <line x1="330" y1="212" x2="330" y2="234" stroke="#52606D" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect class="row" data-role="root-cause" x="8" y="236" width="784" height="64" rx="6" fill="#F5F7FA" stroke="#1D4ED8" stroke-width="1.5"/>
    <text x="18" y="263">Почему это отклонение</text>
    <text x="18" y="287">произошло?</text>
    <text x="276" y="275">Root cause</text>
    <text x="506" y="263">имя отсутствует</text>
    <text x="506" y="287">в allowlist</text>
    <line x1="330" y1="300" x2="330" y2="322" stroke="#52606D" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect class="row" data-role="evidence" x="8" y="324" width="784" height="64" rx="6" fill="#F5F7FA" stroke="#1D4ED8" stroke-width="1.5"/>
    <text x="18" y="363">Чем доказываем?</text>
    <text x="276" y="351">конкретное событие</text>
    <text x="276" y="375">Trace</text>
    <text x="506" y="351" font-family="PT Mono, DejaVu Sans Mono, monospace">call-X,</text>
    <text x="506" y="375" font-family="PT Mono, DejaVu Sans Mono, monospace">execution: not performed</text>
    <line x1="330" y1="388" x2="330" y2="410" stroke="#52606D" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect class="row" data-role="local-fix" x="8" y="412" width="784" height="64" rx="6" fill="#F5F7FA" stroke="#1D4ED8" stroke-width="1.5"/>
    <text x="18" y="439">Что предлагаем</text>
    <text x="18" y="463">исправить?</text>
    <text x="276" y="439">локальная правка</text>
    <text x="276" y="463">только предложение</text>
    <text x="506" y="451">уточнить выбор tool</text>
    <line x1="266" y1="60" x2="266" y2="476" stroke="#52606D" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="496" y1="60" x2="496" y2="476" stroke="#52606D" stroke-width="1" stroke-dasharray="3 3"/>
  </g>
</svg>
