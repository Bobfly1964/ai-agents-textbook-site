<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 860" width="800" height="860" role="img" aria-labelledby="t d">
  <title id="t">Фигура 11. Одна система, разные роли</title>
  <desc id="d">Глава 4, урок 8, раздел 10 «Полная архитектурная карта „Дежурного“». От человека — к приложению / host с harness; от приложения расходятся пять отдельных линий: prompt → модель, structured output → форма результата модели, Agent Skill: catalog → SKILL.md → по необходимости reference, tool → runtime → observation, MCP client → server → resource A и resource B. Одной общей стрелки через все механизмы нет.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52606D"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="860" fill="#FFFFFF"/>
  <g font-family="PT Sans, DejaVu Sans, Arial, sans-serif" font-size="20" fill="#1F2933" text-anchor="middle">
    <!-- человек -->
    <rect data-role="human" x="40" y="20" width="200" height="50" rx="6" fill="#FFFFFF" stroke="#B45309" stroke-width="2"/>
    <text x="140" y="52">человек</text>
    <line x1="140" y1="70" x2="140" y2="98" stroke="#52606D" stroke-width="1.5" marker-end="url(#arrow)"/>
    <!-- приложение / host -->
    <rect data-role="host" x="40" y="100" width="280" height="70" rx="6" fill="#F5F7FA" stroke="#1D4ED8" stroke-width="1.5"/>
    <text x="180" y="130" font-size="22">приложение / host</text>
    <text x="180" y="158" font-size="18">с harness</text>
    <!-- ствол дерева: пять линий из одного приложения -->
    <g stroke="#52606D" stroke-width="1.5" fill="none">
      <line x1="70" y1="170" x2="70" y2="615"/>
      <line x1="70" y1="225" x2="110" y2="225"/>
      <line x1="70" y1="295" x2="110" y2="295"/>
      <line x1="70" y1="365" x2="110" y2="365"/>
      <line x1="70" y1="535" x2="110" y2="535"/>
      <line x1="70" y1="615" x2="110" y2="615"/>
    </g>
    <!-- prompt → модель -->
    <rect data-role="mechanism" x="110" y="200" width="150" height="50" rx="6" fill="#F5F7FA" stroke="#52606D" stroke-width="1.5"/>
    <text x="185" y="231" font-family="PT Mono, DejaVu Sans Mono, monospace" font-size="18">prompt</text>
    <line x1="260" y1="225" x2="328" y2="225" stroke="#52606D" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect data-role="node" x="330" y="200" width="140" height="50" rx="6" fill="#F5F7FA" stroke="#52606D" stroke-width="1.5"/>
    <text x="400" y="232">модель</text>
    <!-- structured output → форма результата модели -->
    <rect data-role="mechanism" x="110" y="270" width="230" height="50" rx="6" fill="#F5F7FA" stroke="#52606D" stroke-width="1.5"/>
    <text x="225" y="301" font-family="PT Mono, DejaVu Sans Mono, monospace" font-size="18">structured output</text>
    <line x1="340" y1="295" x2="388" y2="295" stroke="#52606D" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect data-role="node" x="390" y="270" width="320" height="50" rx="6" fill="#F5F7FA" stroke="#52606D" stroke-width="1.5"/>
    <text x="550" y="302">форма результата модели</text>
    <!-- Agent Skill: catalog → SKILL.md → по необходимости reference -->
    <rect data-role="mechanism" x="110" y="340" width="180" height="50" rx="6" fill="#F5F7FA" stroke="#52606D" stroke-width="1.5"/>
    <text x="200" y="372">Agent Skill</text>
    <line x1="290" y1="365" x2="320" y2="365" stroke="#52606D" stroke-width="1.5"/>
    <rect data-role="node" x="320" y="340" width="130" height="50" rx="6" fill="#F5F7FA" stroke="#52606D" stroke-width="1.5"/>
    <text x="385" y="372">catalog</text>
    <line x1="450" y1="365" x2="478" y2="365" stroke="#52606D" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect data-role="node" x="480" y="340" width="150" height="50" rx="6" fill="#F5F7FA" stroke="#52606D" stroke-width="1.5"/>
    <text x="555" y="372" font-family="PT Mono, DejaVu Sans Mono, monospace">SKILL.md</text>
    <line x1="555" y1="390" x2="555" y2="428" stroke="#52606D" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="567" y="415" font-size="18" text-anchor="start">по необходимости</text>
    <rect data-role="node" x="475" y="430" width="160" height="50" rx="6" fill="#F5F7FA" stroke="#52606D" stroke-width="1.5"/>
    <text x="555" y="462">reference</text>
    <!-- tool → runtime → observation -->
    <rect data-role="mechanism" x="110" y="510" width="120" height="50" rx="6" fill="#F5F7FA" stroke="#52606D" stroke-width="1.5"/>
    <text x="170" y="542">tool</text>
    <line x1="230" y1="535" x2="268" y2="535" stroke="#52606D" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect data-role="node" x="270" y="510" width="140" height="50" rx="6" fill="#F5F7FA" stroke="#52606D" stroke-width="1.5"/>
    <text x="340" y="542">runtime</text>
    <line x1="410" y1="535" x2="448" y2="535" stroke="#52606D" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect data-role="node" x="450" y="510" width="180" height="50" rx="6" fill="#F5F7FA" stroke="#52606D" stroke-width="1.5"/>
    <text x="540" y="542">observation</text>
    <!-- MCP client → server → resource A, resource B -->
    <rect data-role="mechanism" x="110" y="590" width="170" height="50" rx="6" fill="#F5F7FA" stroke="#52606D" stroke-width="1.5"/>
    <text x="195" y="622">MCP client</text>
    <line x1="280" y1="615" x2="318" y2="615" stroke="#52606D" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect data-role="node" x="320" y="590" width="130" height="50" rx="6" fill="#F5F7FA" stroke="#52606D" stroke-width="1.5"/>
    <text x="385" y="622">server</text>
    <polyline points="450,615 470,615 470,592 498,592" fill="none" stroke="#52606D" stroke-width="1.5" marker-end="url(#arrow)"/>
    <polyline points="470,615 470,652 498,652" fill="none" stroke="#52606D" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect data-role="resource" x="500" y="570" width="170" height="44" rx="6" fill="#F5F7FA" stroke="#52606D" stroke-width="1.5"/>
    <text x="585" y="599">resource A</text>
    <rect data-role="resource" x="500" y="630" width="170" height="44" rx="6" fill="#F5F7FA" stroke="#52606D" stroke-width="1.5"/>
    <text x="585" y="659">resource B</text>
    <!-- подписи-неравенства -->
    <g font-family="PT Mono, DejaVu Sans Mono, monospace" font-size="18">
      <rect x="220" y="700" width="360" height="40" rx="6" fill="#F5F7FA" stroke="#1F2933" stroke-width="1.5" stroke-dasharray="6 4"/>
      <text class="inequality" x="400" y="726">resource ≠ active context</text>
      <rect x="220" y="748" width="360" height="40" rx="6" fill="#F5F7FA" stroke="#1F2933" stroke-width="1.5" stroke-dasharray="6 4"/>
      <text class="inequality" x="400" y="774">protocol ≠ trust</text>
      <rect x="220" y="796" width="360" height="40" rx="6" fill="#F5F7FA" stroke="#1F2933" stroke-width="1.5" stroke-dasharray="6 4"/>
      <text class="inequality" x="400" y="822">procedure ≠ permission</text>
    </g>
  </g>
</svg>
