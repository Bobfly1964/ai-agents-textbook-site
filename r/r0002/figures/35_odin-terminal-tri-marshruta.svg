<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="800" height="640" role="img" aria-labelledby="t d">
  <title id="t">Фигура 35. Один терминал — три маршрута</title>
  <desc id="d">Глава 12, урок 24, разделы 1 «Один терминал — три разных маршрута» и 3 «Failure point: где маршрут впервые стал неправильным». Три запуска сходятся в один терминал terminal: error, но failure point у каждого в своём месте: в первом — уже tool_requested с именем вне allowlist, во втором — tool_observation с отказом по arguments, в третьем — tool_observation после начатой разрешённой операции.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52606D"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="640" fill="#FFFFFF"/>
  <g font-family="PT Sans, DejaVu Sans, Arial, sans-serif" font-size="18" fill="#1F2933">
    <text x="140" y="42" text-anchor="middle" fill="#52606D" font-size="20">Запуск 1</text>
    <text x="400" y="42" text-anchor="middle" fill="#52606D" font-size="20">Запуск 2</text>
    <text x="660" y="42" text-anchor="middle" fill="#52606D" font-size="20">Запуск 3</text>
    <rect class="failure-point" data-role="fp-a" x="16" y="60" width="248" height="112" rx="6" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.5"/>
    <text x="140" y="87" text-anchor="middle" fill="#B91C1C">failure point</text>
    <text x="140" y="111" font-family="PT Mono, DejaVu Sans Mono, monospace" text-anchor="middle">tool_requested</text>
    <text x="140" y="135" font-family="PT Mono, DejaVu Sans Mono, monospace" text-anchor="middle">delete_everything</text>
    <text x="140" y="159" text-anchor="middle">нет в allowlist</text>
    <rect class="step" data-role="step-b1" x="276" y="60" width="248" height="112" rx="6" fill="#F5F7FA" stroke="#1D4ED8" stroke-width="1.5"/>
    <text x="400" y="99" font-family="PT Mono, DejaVu Sans Mono, monospace" text-anchor="middle">tool_requested</text>
    <text x="400" y="123" font-family="PT Mono, DejaVu Sans Mono, monospace" text-anchor="middle">validate_task_card</text>
    <text x="400" y="147" text-anchor="middle">имя разрешено</text>
    <rect class="failure-point" data-role="fp-b" x="276" y="208" width="248" height="136" rx="6" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.5"/>
    <text x="400" y="235" text-anchor="middle" fill="#B91C1C">failure point</text>
    <text x="400" y="259" font-family="PT Mono, DejaVu Sans Mono, monospace" text-anchor="middle">tool_observation</text>
    <text x="400" y="283" text-anchor="middle">в arguments</text>
    <text x="400" y="307" text-anchor="middle">не хватает</text>
    <text x="400" y="331" text-anchor="middle">обязательного поля</text>
    <rect class="step" data-role="step-c1" x="536" y="60" width="248" height="112" rx="6" fill="#F5F7FA" stroke="#1D4ED8" stroke-width="1.5"/>
    <text x="660" y="99" font-family="PT Mono, DejaVu Sans Mono, monospace" text-anchor="middle">tool_requested</text>
    <text x="660" y="123" font-family="PT Mono, DejaVu Sans Mono, monospace" text-anchor="middle">read_task_cards</text>
    <text x="660" y="147" text-anchor="middle">имя разрешено</text>
    <rect class="step" data-role="step-c2" x="536" y="208" width="248" height="136" rx="6" fill="#F5F7FA" stroke="#1D4ED8" stroke-width="1.5"/>
    <text x="660" y="235" text-anchor="middle">запрос прошёл</text>
    <text x="660" y="259" text-anchor="middle">проверки,</text>
    <text x="660" y="283" text-anchor="middle">runtime начал</text>
    <text x="660" y="307" text-anchor="middle">разрешённую</text>
    <text x="660" y="331" text-anchor="middle">операцию</text>
    <rect class="failure-point" data-role="fp-c" x="536" y="380" width="248" height="112" rx="6" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.5"/>
    <text x="660" y="407" text-anchor="middle" fill="#B91C1C">failure point</text>
    <text x="660" y="431" font-family="PT Mono, DejaVu Sans Mono, monospace" text-anchor="middle">tool_observation</text>
    <text x="660" y="455" text-anchor="middle">операция встретила</text>
    <text x="660" y="479" text-anchor="middle">недоступные данные</text>
    <rect data-role="terminal" x="280" y="548" width="240" height="64" rx="6" fill="#F5F7FA" stroke="#52606D" stroke-width="1.5"/>
    <text x="400" y="574" font-family="PT Mono, DejaVu Sans Mono, monospace" text-anchor="middle">run_finished</text>
    <text x="400" y="598" font-family="PT Mono, DejaVu Sans Mono, monospace" text-anchor="middle">terminal: error</text>
    <g stroke="#52606D" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
      <polyline points="400,172 400,206"/>
      <polyline points="660,172 660,206"/>
      <polyline points="660,344 660,378"/>
      <polyline points="140,172 140,580 278,580"/>
      <polyline points="400,344 400,546"/>
      <polyline points="660,492 660,580 522,580"/>
    </g>
  </g>
</svg>
