<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 750" width="800" height="750" role="img" aria-labelledby="t d">
  <title id="t">Фигура 17. Schema и сигнатура должны совпасть</title>
  <desc id="d">Глава 6, урок 12, раздел 4 «Schema для validate_task_card(task_id)». Слева сигнатура validate_task_card(task_id), справа schema этой операции с обязательным полем task_id; оба согласованы на одном имени. Внизу три объекта: правильные arguments, arguments без обязательного поля и карточка задачи с недопустимым status.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52606D"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="750" fill="#FFFFFF"/>
  <g font-family="PT Sans, DejaVu Sans, Arial, sans-serif" font-size="20" fill="#1F2933">
    <!-- слева: сигнатура -->
    <rect data-role="signature" x="24" y="24" width="350" height="100" rx="6" fill="#F5F7FA" stroke="#1D4ED8" stroke-width="1.5"/>
    <text x="199" y="62" text-anchor="middle">сигнатура</text>
    <text x="199" y="100" text-anchor="middle" font-family="PT Mono, DejaVu Sans Mono, monospace" font-size="18">validate_task_card(task_id)</text>
    <!-- связь: одно имя -->
    <line x1="199" y1="250" x2="199" y2="128" stroke="#52606D" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect data-role="same-name" x="24" y="252" width="350" height="80" rx="6" fill="#F5F7FA" stroke="#52606D" stroke-width="1.5"/>
    <text x="199" y="284" text-anchor="middle">согласованы на имени</text>
    <text x="199" y="314" text-anchor="middle" font-family="PT Mono, DejaVu Sans Mono, monospace" font-size="18">task_id</text>
    <line x1="374" y1="290" x2="396" y2="290" stroke="#52606D" stroke-width="1.5" marker-end="url(#arrow)"/>
    <!-- справа: schema -->
    <rect data-role="schema" x="398" y="24" width="378" height="362" rx="6" fill="#F5F7FA" stroke="#1D4ED8" stroke-width="1.5"/>
    <g font-family="PT Mono, DejaVu Sans Mono, monospace" font-size="18">
      <text x="414" y="52" fill="#52606D">schema: validate_task_card</text>
      <text x="414" y="80">{</text>
      <text x="428" y="104">"type": "object",</text>
      <text x="428" y="128">"properties": {</text>
      <text x="442" y="152">"task_id": {</text>
      <text x="456" y="176">"type": "string",</text>
      <text x="456" y="200">"minLength": 1</text>
      <text x="442" y="224">}</text>
      <text x="428" y="248">},</text>
      <text x="428" y="272">"required": [</text>
      <text x="442" y="296">"task_id"</text>
      <text x="428" y="320">],</text>
      <text x="428" y="344">"additionalProperties": false</text>
      <text x="414" y="368">}</text>
    </g>
    <!-- внизу: три объекта -->
    <text x="40" y="434" font-size="18" fill="#52606D">объект</text>
    <text x="420" y="434" font-size="18" fill="#52606D">проверка формы</text>
    <rect class="row" data-role="valid" x="24" y="446" width="752" height="64" rx="6" fill="#F5F7FA" stroke="#15803D" stroke-width="1.5"/>
    <text x="40" y="484" font-family="PT Mono, DejaVu Sans Mono, monospace" font-size="18">{"task_id": "task-003"}</text>
    <text x="420" y="484" font-family="PT Mono, DejaVu Sans Mono, monospace" font-size="18" fill="#15803D">JSON Schema: valid</text>
    <rect class="row" data-role="rejected" x="24" y="522" width="752" height="64" rx="6" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.5"/>
    <text x="40" y="560" font-family="PT Mono, DejaVu Sans Mono, monospace" font-size="18">{}</text>
    <text x="420" y="560" font-size="18" fill="#B91C1C">нет обязательного поля task_id</text>
    <rect class="row" data-role="rejected" x="24" y="598" width="752" height="64" rx="6" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.5"/>
    <text x="40" y="624" font-size="18">карточка задачи:</text>
    <text x="40" y="650" font-family="PT Mono, DejaVu Sans Mono, monospace" font-size="18">"status": "paused"</text>
    <text x="420" y="636" font-size="18" fill="#B91C1C">значение не входит в enum</text>
    <line x1="404" y1="446" x2="404" y2="662" stroke="#52606D" stroke-width="1" stroke-dasharray="3 3"/>
    <!-- подпись-граница -->
    <g font-family="PT Mono, DejaVu Sans Mono, monospace" font-size="18" text-anchor="middle">
      <rect x="220" y="686" width="360" height="40" rx="6" fill="#F5F7FA" stroke="#1F2933" stroke-width="1.5" stroke-dasharray="6 4"/>
      <text class="inequality" x="400" y="712">schema check ≠ trust</text>
    </g>
  </g>
</svg>
