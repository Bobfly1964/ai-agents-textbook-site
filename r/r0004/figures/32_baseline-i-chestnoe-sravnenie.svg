<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 664" width="800" height="664" role="img" aria-labelledby="t d">
  <title id="t">Фигура 32. Baseline и честное сравнение</title>
  <desc id="d">Глава 11, урок 22, раздел 1 «Сравнение ломается, если одновременно менять правила». Два комплекта результатов — версия A (Baseline) и версия B (после изменения) — над одним и тем же набором из шести случаев и одной Rubric: каждая строка случая — один прямоугольник через обе колонки, набор между колонками не меняется.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52606D"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="664" fill="#FFFFFF"/>
  <g font-family="PT Sans, DejaVu Sans, Arial, sans-serif" font-size="18" fill="#1F2933">
    <!-- одна Rubric над обеими колонками -->
    <rect data-role="rubric" x="348" y="24" width="436" height="70" rx="6" fill="#F5F7FA" stroke="#1D4ED8" stroke-width="1.5"/>
    <text x="566" y="52" font-size="20" text-anchor="middle">Rubric</text>
    <text x="566" y="80" text-anchor="middle">одни и те же критерии для A и B</text>
    <g stroke="#52606D" stroke-width="1.5" marker-end="url(#arrow)">
      <line x1="453" y1="94" x2="453" y2="124"/>
      <line x1="679" y1="94" x2="679" y2="124"/>
    </g>
    <!-- заголовки столбцов -->
    <g fill="#52606D">
      <text data-role="header" x="18" y="166">один и тот же набор случаев</text>
      <text data-role="header" x="453" y="144" text-anchor="middle">версия A</text>
      <text x="453" y="166" text-anchor="middle">(Baseline)</text>
      <text data-role="header" x="679" y="144" text-anchor="middle">версия B</text>
      <text x="679" y="166" text-anchor="middle">(после изменения)</text>
    </g>
    <!-- шесть случаев: каждая строка — один прямоугольник через обе колонки -->
    <rect class="row" data-role="row" x="8" y="180" width="784" height="48" rx="6" fill="#F5F7FA" stroke="#52606D" stroke-width="1.5"/>
    <text x="18" y="210">один однозначный результат</text>
    <text x="453" y="210" text-anchor="middle">…</text>
    <text x="679" y="210" text-anchor="middle">…</text>
    <rect class="row" data-role="row" x="8" y="236" width="784" height="48" rx="6" fill="#F5F7FA" stroke="#52606D" stroke-width="1.5"/>
    <text x="18" y="266">неоднозначность</text>
    <text x="453" y="266" text-anchor="middle">…</text>
    <text x="679" y="266" text-anchor="middle">…</text>
    <rect class="row" data-role="row" x="8" y="292" width="784" height="48" rx="6" fill="#F5F7FA" stroke="#52606D" stroke-width="1.5"/>
    <text x="18" y="322">пустой результат</text>
    <text x="453" y="322" text-anchor="middle">…</text>
    <text x="679" y="322" text-anchor="middle">…</text>
    <rect class="row" data-role="row" x="8" y="348" width="784" height="48" rx="6" fill="#F5F7FA" stroke="#52606D" stroke-width="1.5"/>
    <text x="18" y="378">ошибка чтения</text>
    <text x="453" y="378" text-anchor="middle">…</text>
    <text x="679" y="378" text-anchor="middle">…</text>
    <rect class="row" data-role="row" x="8" y="404" width="784" height="48" rx="6" fill="#F5F7FA" stroke="#52606D" stroke-width="1.5"/>
    <text x="18" y="434">достижение лимита</text>
    <text x="453" y="434" text-anchor="middle">…</text>
    <text x="679" y="434" text-anchor="middle">…</text>
    <rect class="row" data-role="row" x="8" y="460" width="784" height="64" rx="6" fill="#F5F7FA" stroke="#52606D" stroke-width="1.5"/>
    <text x="18" y="486">запрос на запрещённое</text>
    <text x="18" y="510">действие</text>
    <text x="453" y="498" text-anchor="middle">…</text>
    <text x="679" y="498" text-anchor="middle">…</text>
    <g stroke="#52606D" stroke-width="1" stroke-dasharray="3 3">
      <line x1="340" y1="180" x2="340" y2="524"/>
      <line x1="566" y1="180" x2="566" y2="524"/>
    </g>
    <!-- правило главы -->
    <rect data-role="rule" x="8" y="548" width="784" height="92" rx="6" fill="#FFFFFF" stroke="#52606D" stroke-width="1.5"/>
    <g text-anchor="middle">
      <text x="400" y="576">сравнение честно только тогда, когда обе стороны</text>
      <text x="400" y="602">проходят один и тот же заранее заданный набор</text>
      <text x="400" y="628">по одним и тем же критериям</text>
    </g>
  </g>
</svg>
