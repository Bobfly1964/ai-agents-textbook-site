<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 590" width="800" height="590" role="img" aria-labelledby="t d">
  <title id="t">Фигура 39. Один набор, две Version</title>
  <desc id="d">Глава 13, урок 26, раздел 6 «Практика A: две распечатанные Version». Один и тот же набор Test cases ch13-project-status входит в обе колонки — Version A (1.0.0) и Version B (1.1.0-candidate); Regression отмечена только там, где pass сменился на fail; справа развилка revert / keep. Программа Rollback не выполняет.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52606D"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="590" fill="#FFFFFF"/>
  <g font-family="PT Sans, DejaVu Sans, Arial, sans-serif" font-size="18" fill="#1F2933">
    <!-- один набор -->
    <rect data-role="eval-set" x="8" y="16" width="552" height="68" rx="6" fill="#F5F7FA" stroke="#1D4ED8" stroke-width="1.5"/>
    <text x="284" y="44" font-size="20" text-anchor="middle">один и тот же набор Test cases</text>
    <text x="284" y="72" font-family="PT Mono, DejaVu Sans Mono, monospace" text-anchor="middle">eval_set: ch13-project-status</text>
    <line x1="278" y1="84" x2="278" y2="106" stroke="#52606D" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="390" y1="84" x2="390" y2="106" stroke="#52606D" stroke-width="1.5" marker-end="url(#arrow)"/>
    <!-- заголовки столбцов -->
    <text x="20" y="130" fill="#52606D">Test case</text>
    <text x="278" y="130" fill="#52606D" text-anchor="middle">Version A</text>
    <text x="390" y="130" fill="#52606D" text-anchor="middle">Version B</text>
    <text x="454" y="130" fill="#52606D">Regression?</text>
    <text x="454" y="154" fill="#52606D">pass → fail</text>
    <!-- четыре строки: те же случаи в обеих колонках -->
    <g font-family="PT Mono, DejaVu Sans Mono, monospace">
      <rect class="row" data-role="row" x="8" y="166" width="552" height="52" rx="6" fill="#F5F7FA" stroke="#52606D" stroke-width="1.5"/>
      <text x="20" y="198">validate-task-id</text>
      <text x="278" y="198" text-anchor="middle" fill="#B91C1C">fail</text>
      <text x="390" y="198" text-anchor="middle" fill="#15803D">pass</text>
      <rect class="row" data-role="row" x="8" y="228" width="552" height="52" rx="6" fill="#F5F7FA" stroke="#52606D" stroke-width="1.5"/>
      <text x="20" y="260">asks-on-ambiguity</text>
      <text x="278" y="260" text-anchor="middle" fill="#15803D">pass</text>
      <text x="390" y="260" text-anchor="middle" fill="#B91C1C">fail</text>
      <rect class="row" data-role="row" x="8" y="290" width="552" height="52" rx="6" fill="#F5F7FA" stroke="#52606D" stroke-width="1.5"/>
      <text x="20" y="322">no-status-write</text>
      <text x="278" y="322" text-anchor="middle" fill="#15803D">pass</text>
      <text x="390" y="322" text-anchor="middle" fill="#B91C1C">fail</text>
      <rect class="row" data-role="row" x="8" y="352" width="552" height="52" rx="6" fill="#F5F7FA" stroke="#52606D" stroke-width="1.5"/>
      <text x="20" y="384">builds-report</text>
      <text x="278" y="384" text-anchor="middle" fill="#15803D">pass</text>
      <text x="390" y="384" text-anchor="middle" fill="#15803D">pass</text>
    </g>
    <text class="regression" x="503" y="198" text-anchor="middle">нет</text>
    <text class="regression" x="503" y="260" text-anchor="middle" fill="#B91C1C">да</text>
    <text class="regression" x="503" y="322" text-anchor="middle" fill="#B91C1C">да</text>
    <text class="regression" x="503" y="384" text-anchor="middle">нет</text>
    <line x1="222" y1="166" x2="222" y2="404" stroke="#52606D" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="334" y1="166" x2="334" y2="404" stroke="#52606D" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="446" y1="166" x2="446" y2="404" stroke="#52606D" stroke-width="1" stroke-dasharray="3 3"/>
    <!-- какие состояния сравнивались -->
    <text x="20" y="436">Version A —</text>
    <text x="146" y="436" font-family="PT Mono, DejaVu Sans Mono, monospace">1.0.0</text>
    <text x="244" y="436">Version B —</text>
    <text x="370" y="436" font-family="PT Mono, DejaVu Sans Mono, monospace">1.1.0-candidate</text>
    <!-- развилка справа -->
    <polyline points="560,192 574,192 574,378 560,378" fill="none" stroke="#52606D" stroke-width="1.5"/>
    <line x1="560" y1="254" x2="574" y2="254" stroke="#52606D" stroke-width="1.5"/>
    <line x1="560" y1="316" x2="574" y2="316" stroke="#52606D" stroke-width="1.5"/>
    <line x1="574" y1="192" x2="598" y2="192" stroke="#52606D" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect data-role="fork" x="600" y="166" width="188" height="52" rx="6" fill="#F5F7FA" stroke="#1D4ED8" stroke-width="1.5"/>
    <text x="694" y="198" font-size="20" text-anchor="middle">Regression?</text>
    <line x1="676" y1="218" x2="676" y2="262" stroke="#52606D" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="686" y="246">да</text>
    <line x1="772" y1="218" x2="772" y2="350" stroke="#52606D" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="764" y="246" text-anchor="end">нет</text>
    <rect data-role="decision" x="600" y="264" width="152" height="76" rx="6" fill="#F5F7FA" stroke="#52606D" stroke-width="1.5"/>
    <text x="676" y="294" font-size="20" font-family="PT Mono, DejaVu Sans Mono, monospace" text-anchor="middle">revert</text>
    <text x="676" y="324" text-anchor="middle">Version A</text>
    <rect data-role="decision" x="600" y="352" width="188" height="76" rx="6" fill="#F5F7FA" stroke="#52606D" stroke-width="1.5"/>
    <text x="694" y="382" font-size="20" font-family="PT Mono, DejaVu Sans Mono, monospace" text-anchor="middle">keep</text>
    <text x="694" y="412" text-anchor="middle">Version B</text>
    <!-- Rollback не автоматический -->
    <rect data-role="note" x="8" y="460" width="784" height="96" rx="6" fill="#F5F7FA" stroke="#52606D" stroke-width="1.5"/>
    <text x="24" y="492">программа не выполняет Rollback автоматически — только выдаёт:</text>
    <g font-family="PT Mono, DejaVu Sans Mono, monospace">
      <text x="24" y="530">decision: revert</text>
      <text x="236" y="530">rollback_to: 1.0.0</text>
      <text x="468" y="530">files_changed: no</text>
    </g>
  </g>
</svg>
