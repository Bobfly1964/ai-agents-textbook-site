<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 740" width="800" height="740" role="img" aria-labelledby="t d">
  <title id="t">Фигура 41. Threat model и минимальные полномочия</title>
  <desc id="d">Глава 14, урок 27, раздел 5 «Режим чтения по умолчанию». Сверху — цепочка Asset → нежелательное событие → Trust boundary → Least privilege на примере статуса карточки (урок 27, разделы 1–4). Отдельно — права функций: read_task_cards — чтение (Read-only), изменение статуса — proposal и решение человека, удаления файлов и сети нет.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52606D"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="740" fill="#FFFFFF"/>
  <g font-family="PT Sans, DejaVu Sans, Arial, sans-serif" font-size="20" fill="#1F2933">
    <!-- цепочка: заголовки столбцов -->
    <text x="28" y="40" font-size="18" fill="#52606D">Понятие</text>
    <text x="336" y="40" font-size="18" fill="#52606D">Для статуса карточки</text>
    <!-- Asset -->
    <rect class="stage" data-role="asset" x="16" y="56" width="768" height="74" rx="6" fill="#F5F7FA" stroke="#52606D" stroke-width="1.5"/>
    <text x="168" y="86" text-anchor="middle">Asset</text>
    <text x="168" y="114" font-size="18" text-anchor="middle">защищаемый актив</text>
    <text x="336" y="100" font-size="18">статус задачи</text>
    <line x1="168" y1="130" x2="168" y2="156" stroke="#52606D" stroke-width="1.5" marker-end="url(#arrow)"/>
    <!-- нежелательное событие -->
    <rect class="stage" data-role="event" x="16" y="158" width="768" height="74" rx="6" fill="#F5F7FA" stroke="#52606D" stroke-width="1.5"/>
    <text x="168" y="188" text-anchor="middle">нежелательное</text>
    <text x="168" y="216" text-anchor="middle">событие</text>
    <text x="336" y="202" font-size="18">статус изменён без подтверждения</text>
    <line x1="168" y1="232" x2="168" y2="258" stroke="#52606D" stroke-width="1.5" marker-end="url(#arrow)"/>
    <!-- Trust boundary -->
    <rect class="stage" data-role="trust-boundary" x="16" y="260" width="768" height="74" rx="6" fill="#F5F7FA" stroke="#52606D" stroke-width="1.5"/>
    <text x="168" y="290" text-anchor="middle">Trust boundary</text>
    <text x="168" y="318" font-size="18" text-anchor="middle">граница доверия</text>
    <text x="336" y="290" font-size="18">переход от предложения изменения</text>
    <text x="336" y="318" font-size="18">к его применению</text>
    <line x1="168" y1="334" x2="168" y2="360" stroke="#52606D" stroke-width="1.5" marker-end="url(#arrow)"/>
    <!-- Least privilege -->
    <rect class="stage" data-role="least-privilege" x="16" y="362" width="768" height="74" rx="6" fill="#F5F7FA" stroke="#1D4ED8" stroke-width="1.5"/>
    <text x="168" y="392" text-anchor="middle">Least privilege</text>
    <text x="168" y="420" font-size="18" text-anchor="middle">минимальные полномочия</text>
    <text x="336" y="392" font-size="18">подготовка proposal не требует</text>
    <text x="336" y="420" font-size="18">немедленной записи нового статуса</text>
    <line x1="320" y1="56" x2="320" y2="436" stroke="#52606D" stroke-width="1" stroke-dasharray="3 3"/>
    <!-- отдельно: функция и её право -->
    <text x="28" y="486" font-size="18" fill="#52606D">Функция</text>
    <text x="336" y="486" font-size="18" fill="#52606D">Право</text>
    <rect class="row" data-role="read" x="16" y="500" width="768" height="64" rx="6" fill="#F5F7FA" stroke="#15803D" stroke-width="1.5"/>
    <text x="28" y="538" font-family="PT Mono, DejaVu Sans Mono, monospace">read_task_cards</text>
    <text x="336" y="538" font-size="18" font-family="PT Mono, DejaVu Sans Mono, monospace" fill="#15803D">read</text>
    <text x="390" y="538" font-size="18">— Read-only: чтение без записи</text>
    <rect class="row" data-role="status-change" x="16" y="576" width="768" height="64" rx="6" fill="#F5F7FA" stroke="#B45309" stroke-width="1.5"/>
    <text x="28" y="614">изменение статуса</text>
    <text x="336" y="614" font-size="18" font-family="PT Mono, DejaVu Sans Mono, monospace">proposal</text>
    <text x="436" y="614" font-size="18" fill="#B45309">+ решение человека</text>
    <rect class="row" data-role="absent" x="16" y="652" width="768" height="64" rx="6" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.5"/>
    <text x="28" y="690">удаление файлов, сеть</text>
    <text x="336" y="690" font-size="18" fill="#B91C1C">отсутствуют</text>
    <line x1="320" y1="500" x2="320" y2="716" stroke="#52606D" stroke-width="1" stroke-dasharray="3 3"/>
  </g>
</svg>
